<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор PromoGame</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 22px; margin-bottom: 8px; text-align: center; color: #38bdf8; }
        p.sub { font-size: 14px; color: #94a3b8; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 14px; margin-bottom: 6px; color: #cbd5e1; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 15px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #0284c7; color: #ffffff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .result-box { margin-top: 24px; padding: 16px; background: #0f172a; border: 1px dashed #38bdf8; border-radius: 8px; display: none; }
        .result-title { font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .link-text { font-size: 12px; color: #38bdf8; word-break: break-all; background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 14px; border: 1px solid #334155; }
        .copy-btn { background: #334155; padding: 10px; font-size: 14px; margin-top: 6px; }
        .copy-btn:hover { background: #475569; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Создать промо-акцию</h1>
        <p class="sub">Панель генерации ссылок WebApp</p>

        <form id="campaign-form">
            <div class="form-group">
                <label for="title">Название акции / Заголовок</label>
                <input type="text" id="title" placeholder="например: Скидка 15% на заказы" required>
            </div>

            <div class="form-group">
                <label for="promo">Промокод</label>
                <input type="text" id="promo" placeholder="например: SALE15" required>
            </div>

            <button type="submit" id="submit-btn">Сгенерировать ссылку</button>
        </form>

        <div class="result-box" id="result-box">
            <div class="result-title">1. Прямая ссылка для Telegram (для рассылок и кнопок):</div>
            <div class="link-text" id="tg-link">...</div>

            <div class="result-title">2. Прямая Web-ссылка (для браузеров):</div>
            <div class="link-text" id="web-link">...</div>

            <button class="copy-btn" id="copy-btn">Скопировать Telegram ссылку</button>
        </div>
    </div>

    <script>
        // 1. Загрузка списка акций с количеством активаций
        async function loadCampaigns() {
            const listElement = document.getElementById('campaignsList');
            listElement.innerHTML = 'Загрузка...';

            // Получаем акции и привязанные к ним claims
            const { data: campaigns, error } = await supabaseClient
                .from('campaigns')
                .select(`
                    *,
                    claims (count)
                `)
                .order('created_at', { ascending: false });

            if (error) {
                alert('Ошибка загрузки: ' + error.message);
                return;
            }

            listElement.innerHTML = campaigns.map(c => {
                const claimCount = c.claims[0] ? c.claims[0].count : 0;
                const statusBadge = c.is_active 
                    ? '<span style="color: green;">● Активна</span>' 
                    : '<span style="color: red;">● Отключена</span>';

                return `
                    <div class="campaign-card" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px;">
                        <h3>${c.title} ${statusBadge}</h3>
                        <p><strong>Скидка/Приз:</strong> ${c.discount_text}</p>
                        <p><strong>Активаций:</strong> ${claimCount}</p>
                        <p><small>ID: ${c.id}</small></p>
                
                        <button onclick="toggleCampaign('${c.id}', ${!c.is_active})">
                            ${c.is_active ? 'Пауза' : 'Включить'}
                        </button>
                        <button onclick="exportClaimsToCSV('${c.id}', '${c.title}')">
                            📥 Скачать CSV (Telegram ID)
                        </button>
                    </div>
                `;
            }).join('');
        }

        // 2. Включение / Выключение акции
        async function toggleCampaign(id, newStatus) {
            const { error } = await supabaseClient
                .from('campaigns')
                .update({ is_active: newStatus })
                .eq('id', id);

            if (error) {
                alert('Ошибка обновления: ' + error.message);
            } else {
                loadCampaigns();
            }
        }

        // 3. Выгрузка списка Telegram ID участников в CSV
        async function exportClaimsToCSV(campaignId, campaignTitle) {
            const { data: claims, error } = await supabaseClient
                .from('claims')
                .select('telegram_id, created_at')
                .eq('campaign_id', campaignId);

            if (error || !claims.length) {
                alert('Нет данных для экспорта');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Telegram ID,Дата активации\n";
            claims.forEach(row => {
                csvContent += `${row.telegram_id},${new Date(row.created_at).toLocaleString()}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `claims_${campaignTitle.replace(/\s+/g, '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
