<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Promo Scratch Card</title>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client (через CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card-wrapper {
            position: relative;
            width: 300px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        .prize-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 10px;
        }
        .promo-code {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #2d3436;
            margin-top: 10px;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
        }
        #scratch-canvas {
            position: absolute;
            inset: 0;
            touch-action: none;
            cursor: pointer;
        }
        .greeting {
            font-size: 18px;
            text-align: center;
            font-weight: 600;
        }
        .already-claimed {
            font-size: 14px;
            color: #00b894;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="greeting" id="user-greeting">Загрузка...</div>

    <div class="card-wrapper">
        <div class="prize-layer">
            <div id="prize-status">Твой промокод на -20%:</div>
            <div class="promo-code" id="code-val">SECRET20</div>
        </div>
        <canvas id="scratch-canvas" width="300" height="180"></canvas>
    </div>

    <script>
        // --- 1. Конфигурация Supabase ---
        const SUPABASE_URL = 'https://xvadcrlhexeiieskxefh.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2YWRjcmxoZXhlaWllc2t4ZWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjYzMzQsImV4cCI6MjEwMzI0MjMzNH0.FIUTCgdKE6NMocZPY95bfg9mnWh3kWaBkxp1OCX7UHk';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ID тестовой акции (позже будет динамическим из URL)
        const CURRENT_CAMPAIGN_ID = '00000000-0000-0000-0000-000000000001';

        // --- 2. Инициализация Telegram SDK ---
        const tg = window.Telegram?.WebApp;
        let userId = null;

        if (tg) {
            tg.ready();
            tg.expand();
            userId = tg.initDataUnsafe?.user?.id || 123456789; // Тестовый ID для браузера ПК
            
            const name = tg.initDataUnsafe?.user?.first_name || 'Гость';
            document.getElementById('user-greeting').innerText = `Привет, ${name}! Сотри слой и забери скидку:`;
        }

        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let isRevealed = false;

        // --- 3. Отрисовка холста ---
        function initCanvas() {
            ctx.fillStyle = '#b2bec3';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2d3436';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Сотри пальцем здесь', canvas.width / 2, canvas.height / 2 + 5);
        }

        // --- Проверка повторного участия ---
        async function checkAlreadyClaimed() {
            if (!userId) {
                initCanvas();
                return;
            }

            try {
                const { data, error } = await db
                    .from('claims')
                    .select('id')
                    .eq('campaign_id', CURRENT_CAMPAIGN_ID)
                    .eq('user_telegram_id', userId)
                    .maybeSingle();

                if (error) {
                console.error('Ошибка Supabase Select:', error.message);
                    initCanvas();
                    return;
                }

                if (data) {
                    // Запись найдена: удаляем холст и показываем статус
                    canvas.remove();
                    document.getElementById('user-greeting').innerText = `С возвращением!`;
                    document.getElementById('prize-status').innerHTML = `Вы уже забрали этот промокод:<br><span class="already-claimed">Использовано</span>`;
                } else {
                    // Записи нет: отрисовываем холст для стирания
                    initCanvas();
                }
            } catch (err) {
                console.error('Сетевая ошибка:', err);
                initCanvas();
            }
        }

        // --- 5. Логика стирания ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function scratch(e) {
            if (!isDrawing || !canvas.parentElement) return;
            const { x, y } = getPos(e);
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();
            
            checkScratchPercentage();
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchmove', scratch);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchend', () => isDrawing = false);

        // --- Сохранение попытки в базу ---
        async function saveClaimToDb() {
            if (!userId) return;
    
            const { error } = await db.from('claims').insert([
                { 
                    campaign_id: CURRENT_CAMPAIGN_ID, 
                    user_telegram_id: userId 
                }
            ]);

            if (error) {
                console.error('Ошибка сохранение в БД:', error.message);
            } else {
                console.log('Попытка успешно сохранена в базу!');
            }
        }

        function checkScratchPercentage() {
            if (isRevealed) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 16) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const percentage = (transparentPixels / (pixels.length / 16)) * 100;

            if (percentage > 45) {
                isRevealed = true;
                
                // Фиксируем выборку в базе данных
                saveClaimToDb();

                canvas.style.transition = 'opacity 0.4s ease';
                canvas.style.opacity = '0';
                setTimeout(() => canvas.remove(), 400);

                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }

        // Старт проверки при загрузке страницы
        checkAlreadyClaimed();
    </script>
</body>
</html>
