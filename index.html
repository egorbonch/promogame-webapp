<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Promo Scratch Card</title>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .greeting {
            font-size: 18px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 24px;
        }
        .card-wrapper {
            position: relative;
            width: 300px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: #2d3436;
        }
        .prize-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            padding: 15px;
        }
        .prize-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .promo-code {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #2d3436;
            background: #ffffff;
            padding: 8px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #scratch-canvas {
            position: absolute;
            inset: 0;
            touch-action: none;
            cursor: pointer;
            display: none; /* Скрыт до окончания проверки */
        }
        .status-badge {
            font-size: 14px;
            color: #55efc4;
            margin-top: 10px;
            font-weight: bold;
            display: inline-block;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .error-msg {
            color: #ff7675;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="greeting" id="user-greeting">Загрузка...</div>

        <div class="card-wrapper">
            <div class="prize-layer">
                <div class="prize-title" id="prize-status">Загрузка акции...</div>
                <div class="promo-code" id="code-val">...</div>
            </div>
            <canvas id="scratch-canvas" width="300" height="180"></canvas>
        </div>
    </div>

    <script>
        // === 1. НАСТРОЙКИ SUPABASE (ВСТАВЬ СВОИ КЛЮЧИ) ===
        const SUPABASE_URL = 'https://xvadcrlhexeiieskxefh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2YWRjcmxoZXhlaWllc2t4ZWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjYzMzQsImV4cCI6MjEwMzI0MjMzNH0.FIUTCgdKE6NMocZPY95bfg9mnWh3kWaBkxp1OCX7UHk';

        const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // === 2. ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP ===
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // === 3. УНИВЕРСАЛЬНОЕ ОПРЕДЕЛЕНИЕ ID АКЦИИ ===
        function getCampaignId() {
            // 1. Проверка из обычных GET-параметров (?campaign_id=... или ?tgWebAppStartParam=...)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('campaign_id')) return urlParams.get('campaign_id');
            if (urlParams.get('tgWebAppStartParam')) return urlParams.get('tgWebAppStartParam');

            // 2. Проверка через Telegram SDK
            if (window.Telegram?.WebApp?.initDataUnsafe?.start_param) {
                return window.Telegram.WebApp.initDataUnsafe.start_param;
            }

            // 3. Проверка из ХЭША URL (#tgWebAppStartParam=...)
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            if (hashParams.get('tgWebAppStartParam')) return hashParams.get('tgWebAppStartParam');

            // 4. Разбор сырых данных Telegram (tgWebAppData)
            const tgWebAppData = hashParams.get('tgWebAppData') || urlParams.get('tgWebAppData');
            if (tgWebAppData) {
                const parsedData = new URLSearchParams(tgWebAppData);
                if (parsedData.get('start_param')) return parsedData.get('start_param');
            }

            return null;
        }

        const CURRENT_CAMPAIGN_ID = getCampaignId();

        let userId = tg?.initDataUnsafe?.user?.id;
        if (!userId) {
            userId = localStorage.getItem('demo_user_id');
            if (!userId) {
                userId = 'test_user_' + Math.floor(Math.random() * 1000000);
                localStorage.setItem('demo_user_id', userId);
            }
        } else {
            userId = String(userId);
        }

        const CACHE_KEY = CURRENT_CAMPAIGN_ID ? `claimed_${CURRENT_CAMPAIGN_ID}_${userId}` : null;
        
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const greetingEl = document.getElementById('user-greeting');
        const statusEl = document.getElementById('prize-status');
        const codeEl = document.getElementById('code-val');

        let isDrawing = false;
        let isRevealed = false;

        // === 4. ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE ===
        async function loadCampaignDetails() {
            if (!CURRENT_CAMPAIGN_ID) {
                greetingEl.innerText = 'Отладка';
                statusEl.innerHTML = `<span class="error-msg">ID не найден.<br>URL: ${window.location.href}</span>`;
                codeEl.innerText = 'N/A';
                return false;
            }
            //if (!CURRENT_CAMPAIGN_ID) {
                //greetingEl.innerText = 'Ошибка';
                //statusEl.innerHTML = '<span class="error-msg">Акция не найдена.<br>Откройте ссылку из админки.</span>';
                //codeEl.innerText = 'N/A';
                //return false;
            //}

            if (!db) {
                console.error('Supabase клиент не инициализирован');
                return false;
            }

            try {
                const { data, error } = await db
                    .from('campaigns')
                    .select('title, promo_code')
                    .eq('id', CURRENT_CAMPAIGN_ID)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    statusEl.innerText = data.title;
                    codeEl.innerText = data.promo_code;
                    return true;
                } else {
                    greetingEl.innerText = 'Уведомление';
                    statusEl.innerText = 'Акция не найдена';
                    codeEl.innerText = 'EXPIRED';
                    return false;
                }
            } catch (err) {
                console.error('Ошибка загрузки акции:', err);
                statusEl.innerText = 'Ошибка загрузки';
                return false;
            }
        }

        // === 5. ПРОВЕРКА ЗАЩИТЫ ОТ АБУЗА ===
        async function startApp() {
            const userName = tg?.initDataUnsafe?.user?.first_name || 'Гость';
            greetingEl.innerText = `Привет, ${userName}!`;

            const isLoaded = await loadCampaignDetails();
            if (!isLoaded) return;

            // Локальная проверка (уровень 1)
            if (CACHE_KEY && localStorage.getItem(CACHE_KEY) === 'true') {
                showClaimedUI();
                return;
            }

            // Серверная проверка (уровень 2)
            if (db && CURRENT_CAMPAIGN_ID) {
                try {
                    const { data } = await db
                        .from('claims')
                        .select('id')
                        .eq('campaign_id', CURRENT_CAMPAIGN_ID)
                        .eq('user_telegram_id', userId)
                        .maybeSingle();

                    if (data) {
                        localStorage.setItem(CACHE_KEY, 'true');
                        showClaimedUI();
                        return;
                    }
                } catch (e) {
                    console.error('Ошибка проверки в базе:', e);
                }
            }

            initCanvas();
        }

        function showClaimedUI() {
            canvas.style.display = 'none';
            greetingEl.innerText = `С возвращением!`;
            statusEl.innerHTML = `Вы уже забрали этот промокод:<br><span class="status-badge">Использовано</span>`;
        }

        // === 6. ОТРИСОВКА И СТИРАНИЕ CANVAS ===
        function initCanvas() {
            canvas.style.display = 'block';
            ctx.fillStyle = '#b2bec3';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#2d3436';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Сотри пальцем здесь', canvas.width / 2, canvas.height / 2 + 5);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function scratch(e) {
            if (!isDrawing || isRevealed) return;
            const { x, y } = getPos(e);
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();
            
            checkScratchPercentage();
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchmove', scratch);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchend', () => isDrawing = false);

        // === 7. ФИКСАЦИЯ ПОБЕДЫ ===
        async function checkScratchPercentage() {
            if (isRevealed) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 16) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const percentage = (transparentPixels / (pixels.length / 16)) * 100;

            if (percentage > 45) {
                isRevealed = true;
                
                if (CACHE_KEY) {
                    localStorage.setItem(CACHE_KEY, 'true');
                }

                if (db && CURRENT_CAMPAIGN_ID) {
                    db.from('claims').insert([
                        { campaign_id: CURRENT_CAMPAIGN_ID, user_telegram_id: userId }
                    ]).then(({ error }) => {
                        if (error) console.error('Ошибка записи в Supabase:', error.message);
                    });
                }

                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                canvas.style.transition = 'opacity 0.4s ease';
                canvas.style.opacity = '0';
                setTimeout(() => canvas.remove(), 400);
            }
        }

        startApp();
    </script>
</body>
</html>
